[program:ds41-exl3]
command=/workspace/ds41-exl3/scripts/serve.sh
directory=/workspace/ds41-exl3
autostart=true
autorestart=unexpected
redirect_stderr=true
stdout_logfile=/workspace/ds41-exl3/logs/server.log
stdout_logfile_maxbytes=50000000
stdout_logfile_backups=3
stopasgroup=true
killasgroup=true
stopwaitsecs=30
